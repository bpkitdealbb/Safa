<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafaBoxBD - লাইফটাইম ইনভেন্টরি লেজার</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #f3f4f6; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        @media print { .no-print { display: none !important; } body { background: #fff; } }
    </style>
</head>
<body class="pb-24">

<header class="bg-gradient-to-r from-emerald-600 to-teal-700 text-white sticky top-0 z-40 shadow-md no-print">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-boxes-packing text-2xl text-amber-300"></i>
            <div>
                <h1 class="text-lg font-bold leading-tight">SafaBoxBD লেজার</h1>
                <p class="text-xs text-emerald-100">লাইফটাইম স্টক, গড় দাম ও লাভ</p>
            </div>
        </div>
        <button onclick="syncNow(true)" class="text-xs bg-emerald-800 hover:bg-emerald-900 px-2.5 py-1.5 rounded-lg flex items-center gap-1.5 shadow-sm">
            <i id="sync-icon" class="fa-solid fa-cloud"></i>
            <span id="sync-text">...</span>
        </button>
    </div>
</header>

<main id="view" class="max-w-2xl mx-auto px-3 pt-3"></main>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-30 no-print">
    <div class="max-w-2xl mx-auto grid grid-cols-4 text-[11px] font-semibold">
        <button id="nav-home" onclick="goTab('home')" class="py-2.5 flex flex-col items-center gap-0.5 text-gray-500"><i class="fa-solid fa-chart-pie text-base"></i>হোম</button>
        <button id="nav-stock" onclick="goTab('stock')" class="py-2.5 flex flex-col items-center gap-0.5 text-gray-500"><i class="fa-solid fa-cubes text-base"></i>স্টক</button>
        <button id="nav-batch" onclick="goTab('batch')" class="py-2.5 flex flex-col items-center gap-0.5 text-gray-500"><i class="fa-solid fa-box-open text-base"></i>ব্যাচ</button>
        <button id="nav-ledger" onclick="goTab('ledger')" class="py-2.5 flex flex-col items-center gap-0.5 text-gray-500"><i class="fa-solid fa-book text-base"></i>লেজার</button>
    </div>
</nav>

<div id="modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-3 hidden no-print">
    <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl">
        <div class="flex justify-between items-center border-b p-3">
            <h3 id="modal-title" class="font-bold text-sm text-gray-800"></h3>
            <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl leading-none">&times;</button>
        </div>
        <div id="modal-body" class="p-3 overflow-y-auto text-xs space-y-2.5"></div>
    </div>
</div>

<div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-xs px-4 py-2 rounded-full shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none z-[60]"></div>

<script>
// ===PURE-START===
function num(v) { const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function emptyAgg() { return { pktG: 0, pktCost: 0, bulkG: 0, bulkCost: 0, bulkRev: 0, eatG: 0, eatCost: 0, exp: 0 }; }

// লেনদেনের লগ থেকে সব হিসাব বের করে (মুভিং ওয়েটেড এভারেজ)
function compute(txs, batches) {
    const sorted = txs.slice().sort((a, b) => (a.ts - b.ts) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    const items = {}, order = [], costOf = {}, byRef = {}, blendOutCost = {};
    const negatives = [];
    const standalone = emptyAgg();
    let expTotal = 0;

    function get(n) {
        if (!items[n]) {
            order.push(n);
            items[n] = { name: n, idx: order.length - 1, stock: 0, value: 0, lastAvg: 0,
                boughtG: 0, boughtCost: 0, pktG: 0, pktCost: 0, bulkG: 0, bulkCost: 0, bulkRev: 0,
                eatG: 0, eatCost: 0, blendG: 0, blendCost: 0, madeG: 0, madeCost: 0, adjG: 0,
                minP: null, maxP: null, lastBuy: null, buys: [], isMixed: false };
        }
        return items[n];
    }

    sorted.forEach(t => {
        if (t.type === 'EXPENSE') {
            const a = num(t.amountTk);
            expTotal += a; costOf[t.id] = a;
            const rf = t.ref || '';
            if (rf.indexOf('b_') === 0) { (byRef[rf] || (byRef[rf] = emptyAgg())).exp += a; }
            else if (rf === '') standalone.exp += a;
            return;
        }
        const it = get(t.item);
        const g = num(t.grams);
        if (t.type === 'OPENING' || t.type === 'RESTOCK') {
            const p = num(t.pricePerKg), c = g / 1000 * p;
            it.stock += g; it.value += c; it.boughtG += g; it.boughtCost += c;
            it.lastBuy = p;
            it.minP = it.minP === null ? p : Math.min(it.minP, p);
            it.maxP = it.maxP === null ? p : Math.max(it.maxP, p);
            if (it.stock > 1e-9) it.lastAvg = it.value / it.stock * 1000;
            it.buys.push({ id: t.id, date: t.date, ts: t.ts, type: t.type, g, price: p, cost: c, avgAfter: it.lastAvg });
            costOf[t.id] = c;
        } else if (t.type === 'ADJUST_IN') {
            const c = it.stock > 1e-9 ? g * it.value / it.stock : g / 1000 * it.lastAvg;
            it.stock += g; it.value += c; it.adjG += g;
            if (it.stock > 1e-9) it.lastAvg = it.value / it.stock * 1000;
            costOf[t.id] = c;
        } else if (t.type === 'BLEND_IN') {
            const c = (t.ref && blendOutCost[t.ref] !== undefined) ? blendOutCost[t.ref] : num(t.amountTk);
            it.stock += g; it.value += c; it.madeG += g; it.madeCost += c; it.isMixed = true; if (g > 0) it.lastBuy = c / g * 1000;
            if (it.stock > 1e-9) it.lastAvg = it.value / it.stock * 1000;
            costOf[t.id] = c;
        } else {
            let c;
            if (it.stock > 1e-9) c = g * it.value / it.stock; else c = g / 1000 * it.lastAvg;
            if (g > it.stock + 1e-6) negatives.push({ item: t.item, tx: t.id });
            it.stock -= g; it.value -= c;
            if (Math.abs(it.stock) < 1e-6) { it.stock = 0; it.value = 0; }
            if (it.value < 0) it.value = 0;
            costOf[t.id] = c;
            const ref = t.ref || '';
            let agg = null;
            if (ref.indexOf('b_') === 0) { agg = byRef[ref] || (byRef[ref] = emptyAgg()); }
            else if (ref === '') { agg = standalone; }
            if (t.type === 'PACKET') { it.pktG += g; it.pktCost += c; if (agg) { agg.pktG += g; agg.pktCost += c; } }
            else if (t.type === 'BULK') { const r = num(t.amountTk); it.bulkG += g; it.bulkCost += c; it.bulkRev += r; if (agg) { agg.bulkG += g; agg.bulkCost += c; agg.bulkRev += r; } }
            else if (t.type === 'EAT') { it.eatG += g; it.eatCost += c; if (agg) { agg.eatG += g; agg.eatCost += c; } }
            else if (t.type === 'BLEND_OUT') { it.blendG += g; it.blendCost += c; blendOutCost[t.ref] = (blendOutCost[t.ref] || 0) + c; }
        }
    });

    const list = order.map(n => {
        const it = items[n];
        it.avg = it.stock > 1e-9 ? it.value / it.stock * 1000 : it.lastAvg;
        it.lifeAvgBuy = it.boughtG > 0 ? it.boughtCost / it.boughtG * 1000 : (it.madeG > 0 ? it.madeCost / it.madeG * 1000 : 0);
        it.repl = it.lastBuy === null ? it.avg : it.lastBuy;
        it.usedG = it.pktG + it.bulkG + it.eatG + it.blendG;
        it.usedCost = it.pktCost + it.bulkCost + it.eatCost + it.blendCost;
        return it;
    });

    const bres = batches.slice().sort((a, b) => a.ts - b.ts).map(b => {
        const a = byRef[b.id] || emptyAgg();
        const packets = num(b.packets), pkg = num(b.packagingCost), sell = num(b.sellingPrice);
        const totalPacketCost = a.pktCost + pkg;
        const costPerPacket = totalPacketCost / (packets > 0 ? packets : 1);
        const sold = (b.soldPackets === undefined || b.soldPackets === null || b.soldPackets === '') ? packets : num(b.soldPackets);
        const packetRevenue = sold * sell;
        const packetProfit = packetRevenue - totalPacketCost;
        const bulkProfit = a.bulkRev - a.bulkCost;
        const net = packetProfit + bulkProfit - a.eatCost - a.exp;
        const margin = costPerPacket > 0 ? (sell - costPerPacket) / costPerPacket * 100 : 0;
        return Object.assign({}, b, a, { packets, packagingCost: pkg, sellingPrice: sell, soldPackets: sold, otherCost: a.exp,
            totalPacketCost, costPerPacket, packetRevenue, packetProfit, bulkProfit, net, margin });
    });

    const T = { stockValue: 0, boughtCost: 0, boughtG: 0, pktCost: 0, bulkCost: 0, bulkRev: 0, eatCost: 0, eatG: 0,
        packaging: 0, packetRevenue: 0, packets: 0, profit: 0, expense: 0, adjG: 0 };
    list.forEach(it => {
        T.stockValue += it.value; T.boughtCost += it.boughtCost; T.boughtG += it.boughtG;
        T.pktCost += it.pktCost; T.bulkCost += it.bulkCost; T.bulkRev += it.bulkRev;
        T.eatCost += it.eatCost; T.eatG += it.eatG; T.adjG += it.adjG;
    });
    bres.forEach(b => { T.packaging += b.packagingCost; T.packetRevenue += b.packetRevenue; T.packets += b.packets; });
    T.expense = expTotal;
    T.profit = T.packetRevenue + T.bulkRev - T.pktCost - T.bulkCost - T.packaging - T.eatCost - T.expense;

    return { items: list, map: items, batches: bres, byRef, standalone, costOf, totals: T, negatives };
}

// এই মুহূর্তের গড় দামে g গ্রামের খরচ
function costNow(it, g) {
    if (!it) return 0;
    g = num(g);
    return it.stock > 1e-9 ? g * it.value / it.stock : g / 1000 * it.lastAvg;
}
// ===PURE-END===

// ---------- সেটআপ ও ডাটা ----------
const DEFAULT_ENDPOINT = "https://script.google.com/macros/s/AKfycbzGGzjr6I84BuxNppEcKrlXxjtrvJwx2OtQXUozeq11AkzwZeGORjEYS5L2sPbhB0S-/exec";
const LS_KEY = 'safabox_ledger_v2';
const LS_DRAFT = 'safabox_batch_draft_v2';
function endpoint() { return localStorage.getItem('sbx_endpoint') || DEFAULT_ENDPOINT; }
function getKey() { return localStorage.getItem('sbx_key') || ''; }

const DEFAULT_ITEMS = [
    ['কাঠবাদাম', 1320], ['কাজুবাদাম', 1380], ['আখরোট', 1000], ['চীনাবাদাম', 320], ['কিসমিস', 870],
    ['কুমড়ো বীজ', 800], ['সূর্যমুখী বীজ', 250], ['সাদা তিল', 235], ['খুরমা', 240], ['কালো জিরা', 500]
];
const TYPE_LABEL = { OPENING: 'শুরুর স্টক', RESTOCK: 'রিস্টক', PACKET: 'প্যাকেট', BULK: 'বাল্ক বিক্রি', EAT: 'খাওয়া/ঘাটতি', BLEND_OUT: 'ব্লেন্ডে ব্যবহার', BLEND_IN: 'ব্লেন্ড তৈরি', ADJUST_IN: 'ওজন সংশোধন (বেশি)', EXPENSE: 'অন্যান্য খরচ' };
const TYPE_COLOR = { OPENING: 'bg-sky-100 text-sky-800', RESTOCK: 'bg-sky-100 text-sky-800', PACKET: 'bg-emerald-100 text-emerald-800', BULK: 'bg-blue-100 text-blue-800', EAT: 'bg-rose-100 text-rose-800', BLEND_OUT: 'bg-purple-100 text-purple-800', BLEND_IN: 'bg-purple-100 text-purple-800', ADJUST_IN: 'bg-amber-100 text-amber-800', EXPENSE: 'bg-orange-100 text-orange-800' };

function loadDb() {
    try {
        const d = JSON.parse(localStorage.getItem(LS_KEY));
        if (d && Array.isArray(d.txs)) return { txs: d.txs, batches: d.batches || [], pendingDeleteTx: d.pendingDeleteTx || [], pendingDeleteBatch: d.pendingDeleteBatch || [], running: d.running || null, runningDirty: !!d.runningDirty };
    } catch (e) {}
    return { txs: [], batches: [], pendingDeleteTx: [], pendingDeleteBatch: [], running: null, runningDirty: false };
}
let db = loadDb();
let state = compute(db.txs, db.batches);
let ui = { tab: 'home', ledgerTab: 'batches', stockSort: 'cost', expanded: {}, openBatch: {}, txItem: '', txType: '', txLimit: 60, bfOpen: {} };

function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(db)); } catch (e) {} }
function recompute() { state = compute(db.txs, db.batches); }
function refresh() { recompute(); persist(); render(); scheduleSync(); }

// ---------- ছোট ফাংশন ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 2) => { n = Number(n) || 0; if (Math.abs(n) < Math.pow(10, -d) / 2) n = 0; return n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); };
const tk = n => '৳ ' + fmt(n);
const fg = n => { n = Number(n) || 0; return (Math.round(n * 10) / 10).toLocaleString('en-US') + ' g'; };
const round = (n, d) => Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
const profitCls = n => n >= 0 ? 'text-emerald-700' : 'text-red-600';
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function dateStr(ms) { const d = new Date(ms); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function el(id) { return document.getElementById(id); }
function setVal(id, v) { const e = el(id); if (e) e.value = v; }
function setHtml(id, v) { const e = el(id); if (e) e.innerHTML = v; }
function toast(msg) { const t = el('toast'); t.textContent = msg; t.classList.remove('opacity-0'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.add('opacity-0'), 2600); }
const INP = 'w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm text-center font-semibold';
const INP_L = 'w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm font-semibold';

function makeTx(type, item, grams, pricePerKg, amountTk, ref, note, ts) {
    return { id: uid('t_'), ts, date: dateStr(ts), type, item, grams: round(grams, 3), pricePerKg: round(pricePerKg, 4), amountTk: round(amountTk, 4), ref: ref || '', note: note || '', synced: false };
}

// ---------- নেভিগেশন ও রেন্ডার ----------
function goTab(t) { ui.tab = t; render(); window.scrollTo(0, 0); }
function render() {
    updateBadge();
    ['home', 'stock', 'batch', 'ledger'].forEach(t => {
        const b = el('nav-' + t);
        b.className = 'py-2.5 flex flex-col items-center gap-0.5 ' + (ui.tab === t ? 'text-emerald-700' : 'text-gray-500');
    });
    let html = '';
    if (ui.tab === 'home') html = viewHome();
    else if (ui.tab === 'stock') html = viewStock();
    else if (ui.tab === 'batch') html = viewBatch();
    else html = viewLedger();
    el('view').innerHTML = html;
    if (!db.txs.length) obRender();
    else if (ui.tab === 'batch') batchPreview();
}

// ---------- হোম ----------
function viewHome() {
    if (!db.txs.length) return viewOnboarding();
    const T = state.totals;
    const maxUsed = Math.max(1, ...state.items.map(i => i.usedCost));
    const used = state.items.filter(i => i.usedCost > 0).sort((a, b) => b.usedCost - a.usedCost);
    const low = state.items.filter(i => i.stock < 200);
    return `
    ${state.negatives.length ? `<div class="bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl p-2.5 mb-3"><i class="fa-solid fa-triangle-exclamation mr-1"></i>সতর্কতা: ${esc([...new Set(state.negatives.map(n => n.item))].join(', '))} এর স্টক মাইনাসে গেছে। লেজার থেকে ভুল এন্ট্রি ঠিক করুন।</div>` : ''}
    ${db.running ? `<button onclick="goTab('batch')" class="w-full text-left bg-amber-50 border border-amber-300 text-amber-900 text-xs rounded-xl p-2.5 mb-3"><i class="fa-solid fa-hourglass-half mr-1"></i><b>একটি ব্যাচ চলছে</b> (শুরু: ${esc(db.running.date)}). প্যাকেট শেষ হলে এখানে চেপে শেষের ওজন দিন।</button>` : ''}
    ${T.adjG > Math.max(100, T.boughtG * 0.02) ? `<div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs rounded-xl p-2.5 mb-3"><i class="fa-solid fa-scale-unbalanced mr-1"></i>মাপায় লেজারের চেয়ে মোট <b>${fg(T.adjG)}</b> বেশি পাওয়া গেছে। আগের কোনো এন্ট্রি বা স্কেল যাচাই করুন।</div>` : ''}
    <div class="bg-white p-4 rounded-xl border border-emerald-200 shadow-sm bg-gradient-to-r from-emerald-50/60 to-teal-50/60 mb-3">
        <div class="flex items-center justify-between">
            <div>
                <span class="text-xs text-gray-600 font-bold block">লাইফটাইম নিট লাভ</span>
                <span class="text-[11px] text-gray-400">${state.batches.length}টি ব্যাচ • ${fmt(T.packets, 0)} প্যাকেট</span>
            </div>
            <span class="text-2xl font-extrabold ${profitCls(T.profit)}">${tk(T.profit)}</span>
        </div>
    </div>
    <div class="grid grid-cols-2 gap-2 mb-3">
        ${statCard('fa-warehouse', 'emerald', 'বর্তমান স্টকের মূল্য', tk(T.stockValue))}
        ${statCard('fa-cart-shopping', 'sky', 'মোট কেনা খরচ', tk(T.boughtCost))}
        ${statCard('fa-utensils', 'rose', 'খাওয়া/ঘাটতি খরচ', tk(T.eatCost))}
        ${statCard('fa-box', 'amber', 'ব্যবহার (প্যাকেট+বাল্ক)', tk(T.pktCost + T.bulkCost))}
    </div>

    <div class="grid grid-cols-6 gap-1.5 mb-3 no-print">
        ${qa('fa-box-open', 'emerald', 'নতুন ব্যাচ', "goTab('batch')")}
        ${qa('fa-cart-plus', 'sky', 'রিস্টক', 'openRestock()')}
        ${qa('fa-utensils', 'rose', 'খাওয়া', 'openEat()')}
        ${qa('fa-scale-balanced', 'blue', 'বাল্ক', 'openBulk()')}
        ${qa('fa-blender', 'purple', 'ব্লেন্ড', 'openBlend()')}
        ${qa('fa-receipt', 'orange', 'খরচ', 'openExpense()')}
    </div>

    <div class="bg-gray-800 text-white p-4 rounded-xl shadow-lg mb-3">
        <h3 class="text-sm font-bold text-amber-400 mb-2 border-b border-gray-700 pb-1">লাইফটাইম হিসাব বিবরণী</h3>
        <div class="text-xs space-y-1.5 text-gray-300">
            ${row2('প্যাকেট বিক্রি থেকে আয়', tk(T.packetRevenue), 'text-emerald-300')}
            ${row2('বাল্ক বিক্রি থেকে আয়', tk(T.bulkRev), 'text-emerald-300')}
            ${row2('প্যাকেটে কাঁচামাল খরচ', '- ' + tk(T.pktCost), 'text-rose-300')}
            ${row2('বাল্ক বিক্রির কাঁচামাল খরচ', '- ' + tk(T.bulkCost), 'text-rose-300')}
            ${row2('প্যাকেজিং খরচ', '- ' + tk(T.packaging), 'text-rose-300')}
            ${row2('খাওয়া/ঘাটতি খরচ (' + fg(T.eatG) + ')', '- ' + tk(T.eatCost), 'text-rose-300')}
            ${row2('অন্যান্য খরচ (ডেলিভারি, বিজ্ঞাপন ইত্যাদি)', '- ' + tk(T.expense), 'text-rose-300')}
            <div class="flex justify-between text-sm font-extrabold border-t border-gray-700 pt-1.5 ${T.profit >= 0 ? 'text-emerald-400' : 'text-red-400'}"><span>নিট লাভ</span><span>${tk(T.profit)}</span></div>
        </div>
    </div>

    <div class="bg-white p-3 rounded-xl border border-gray-200 shadow-sm mb-3">

function sfAutoAll() {
    const all = state.items.filter(it => it.stock > EPS);

function sfCompute() {
    const rows = [], errors = [];
    let eatCost = 0, soldRev = 0, soldCost = 0;
    state.items.forEach((it, i) => {
        const r = bf.rows[it.name] || {};
        if (r.meas === undefined || r.meas === '') return;
        const meas = r.auto ? it.stock : num(r.meas), diff = it.stock - meas;
        let short = 0, gain = 0, soldG = 0, soldTk = 0, eatG = 0;
        if (diff > EPS) {
            short = diff; soldG = num(r.soldG); soldTk = num(r.soldTk);
            if (soldG > short + EPS) errors.push(`${it.name}: বিক্রি (${fg(soldG)}) কম পাওয়া অংশের (${fg(short)}) চেয়ে বেশি`);
            eatG = Math.max(0, short - soldG);
        } else if (diff < -EPS) gain = -diff;
        const cEat = costNow(it, eatG), cSold = costNow(it, soldG);
        eatCost += cEat; soldRev += soldTk; soldCost += cSold;

function ffTop(k, v) { bf[k] = v; saveDraft(); ffPreview(); }
function ffRow(i, val) { bfSet(i, runList(), 'end', val); ffPreview(); }
function ffCompute() {
    const run = db.running, list = runList();
    const P = num(bf.packets), pkg = num(bf.packaging), sell = num(bf.sell), other = num(bf.other);
    const sold = (bf.sold === undefined || bf.sold === '') ? P : num(bf.sold);
    const rows = [], errors = [], skipped = [];
    let pktCost = 0, replCost = 0;
    list.forEach((it, i) => {
        const r = bf.rows[it.name] || {};
        if (r.end === undefined || r.end === '') { skipped.push(i); return; }
        const end = num(r.end), used = it.stock - end;
        if (used < -EPS) { errors.push(`${it.name}: শেষের ওজন (${fg(end)}) এখনকার স্টক ${fg(it.stock)} এর চেয়ে বেশি হতে পারে না`); return; }
        const u = Math.max(0, used), c = costNow(it, u);
        pktCost += c; replCost += u / 1000 * it.repl;
        rows.push({ i, name: it.name, end, used: u, cost: c });
    });
    if (sold > P + EPS) errors.push(`বিক্রি (${fmt(sold, 0)}) প্যাকেট সংখ্যার (${fmt(P, 0)}) চেয়ে বেশি হতে পারে না`);
    const a = (run && state.byRef[run.id]) || emptyAgg();
    const totalPacketCost = pktCost + pkg;
    const cpp = totalPacketCost / (P > 0 ? P : 1);
    const revenue = sold * sell, packetProfit = revenue - totalPacketCost;
    const bulkProfit = a.bulkRev - a.bulkCost, eat = a.eatCost, exp = a.exp + other;
    const net = packetProfit + bulkProfit - eat - exp;
    const margin = cpp > 0 ? (sell - cpp) / cpp * 100 : 0;
    const replNet = net + (pktCost - replCost);
    return { P, sold, pkg, sell, other, exp, rows, errors, skipped, pktCost, replCost, replNet, totalPacketCost, cpp, revenue, packetProfit, bulkProfit, eat, net, margin, bulkRev: a.bulkRev, bulkCost: a.bulkCost };
}

// ---------- মোছা ----------
function deleteTx(id) {
    const t = db.txs.find(x => x.id === id); if (!t) return;
    if (t.type !== 'EXPENSE' && t.ref) { deleteGroup(t.ref); return; }
    tryDelete([id], null, 'এই লেনদেনটি মুছবেন?');
}
function deleteGroup(ref) {
    const ids = db.txs.filter(t => t.ref === ref).map(t => t.id);
    const isBatch = ref.indexOf('b_') === 0;
    tryDelete(ids, isBatch ? ref : null, isBatch ? 'পুরো ব্যাচ ও তার সব এন্ট্রি মুছবেন? স্টক আগের অবস্থায় ফিরবে।' : 'পুরো ব্লেন্ডের সব এন্ট্রি মুছবেন?');
}
function tryDelete(ids, batchId, msg) {
    const idSet = new Set(ids);
    const remTx = db.txs.filter(t => !idSet.has(t.id));
    const remB = db.batches.filter(b => b.id !== batchId);
    const test = compute(remTx, remB);
    if (test.negatives.length) { alert('এটি মুছলে ' + [...new Set(test.negatives.map(n => n.item))].join(', ') + ' এর স্টক মাইনাসে চলে যাবে। আগে পরের এন্ট্রিগুলো মুছুন।'); return; }
    if (!confirm(msg)) return;
    db.pendingDeleteTx.push(...ids);
    if (batchId) db.pendingDeleteBatch.push(batchId);
    db.txs = remTx; db.batches = remB;
    if (batchId && db.running && db.running.id === batchId) { db.running = null; db.runningDirty = true; }
    refresh(); toast('মুছে ফেলা হয়েছে');
}

        <p class="text-gray-500">ব্যাচের বাইরে যা খেয়েছেন বা নষ্ট হয়েছে, সেটা এখানে লিখুন। গড় দামে টাকায় রূপান্তর হয়ে লাভ থেকে কাটা যাবে।</p>
        <div><label class="block font-bold text-gray-700 mb-1">আইটেম</label><select id="eat-item" onchange="eatPreview()" class="${INP_L}">${itemOptions(idx)}</select></div>
        <div><label class="block font-bold text-gray-700 mb-1">পরিমাণ (গ্রাম)</label><input id="eat-g" type="number" inputmode="decimal" oninput="eatPreview()" class="${INP}" placeholder="যেমন ৫০"></div>
        <input id="eat-note" class="${INP_L} !text-xs" placeholder="নোট (ইচ্ছাধীন)">
        <div id="eat-prev" class="bg-rose-50 border border-rose-100 rounded-xl p-2.5"></div>
        ${btnMain('eatSave()', 'সেভ করুন', 'rose')}`);
    eatPreview();
}
function eatPreview() {
    const it = state.items[parseInt(el('eat-item').value)], g = num(el('eat-g').value);
    setHtml('eat-prev', `${row2('বর্তমান স্টক', fg(it.stock))}${row2('গড় দর', '৳' + fmt(it.avg) + '/কেজি')}<div class="flex justify-between font-extrabold text-rose-700"><span>লাভ থেকে কাটা যাবে</span><span>${tk(costNow(it, g))}</span></div>`);
}
function eatSave() {
    const it = state.items[parseInt(el('eat-item').value)], g = num(el('eat-g').value);
    if (g <= 0) { alert('গ্রাম লিখুন'); return; }
    if (g > it.stock + 1e-6) { alert('স্টকের চেয়ে বেশি লেখা যাবে না'); return; }
    db.txs.push(makeTx('EAT', it.name, g, 0, costNow(it, g), '', el('eat-note').value.trim(), Date.now()));
    closeModal(); refresh(); toast('খাওয়া/ঘাটতি সেভ হয়েছে');
}

        <div class="grid grid-cols-2 gap-2">

// মিক্সড ব্লেন্ড
let blendRows = [];
function openBlend() {
    if (state.items.length < 2) { alert('ব্লেন্ডের জন্য কমপক্ষে ২টি আইটেম লাগবে'); return; }
    blendRows = [{ i: 0, g: '' }, { i: 1, g: '' }];
    openModal('<i class="fa-solid fa-blender text-purple-600 mr-1.5"></i>মিক্সড ব্লেন্ড (প্রিমিক্স)', `
        <p class="text-gray-500">উপাদানের স্টক কমবে এবং ওই খরচ নিয়ে ব্লেন্ডটি আলাদা আইটেম হিসেবে যুক্ত হবে। উপাদানের লাইফটাইম ব্যবহারে "ব্লেন্ডে গেছে" হিসেবে ধরা থাকবে। লাভ-ক্ষতি তখনই হবে যখন ব্লেন্ডটি প্যাকেটে যাবে।</p>
        <div><label class="block font-bold text-gray-700 mb-1">ব্লেন্ডের নাম</label><input id="bl-name" class="${INP_L} text-purple-900" value="মিক্সড ড্রাই ফ্রুটস ব্লেন্ড"></div>
        <div id="bl-rows" class="space-y-2 border-t pt-2"></div>
        <button onclick="blendAdd()" class="text-purple-700 font-bold"><i class="fa-solid fa-plus-circle mr-1"></i>আরেকটি উপাদান</button>
        <div><label class="block font-bold text-gray-700 mb-1">ব্লেন্ডিংয়ে ওজন কমা/নষ্ট (গ্রাম, ইচ্ছাধীন)</label><input id="bl-loss" type="number" inputmode="decimal" oninput="blendPreview()" class="${INP}" placeholder="০"></div>
        <div id="bl-prev" class="bg-purple-50 border border-purple-100 rounded-xl p-2.5 space-y-1"></div>
        ${btnMain('blendSave()', 'ব্লেন্ড তৈরি করুন', 'purple')}`);
    blendRender();
}
function blendRender() {
    el('bl-rows').innerHTML = blendRows.map((r, k) => `<div class="flex items-center gap-2">
        <select onchange="blendRows[${k}].i=parseInt(this.value);blendPreview()" class="flex-1 border p-1.5 rounded text-xs">${state.items.map(i => `<option value="${i.idx}" ${i.idx === r.i ? 'selected' : ''}>${esc(i.name)} (${fg(i.stock)})</option>`).join('')}</select>
        <input type="number" inputmode="decimal" value="${esc(r.g)}" oninput="blendRows[${k}].g=this.value;blendPreview()" class="w-24 border p-1.5 rounded text-xs text-center font-bold" placeholder="গ্রাম">
        <button onclick="blendDel(${k})" class="text-red-500 p-1"><i class="fa-solid fa-xmark"></i></button></div>`).join('');
    blendPreview();
}
function blendAdd() { blendRows.push({ i: 0, g: '' }); blendRender(); }
function blendDel(k) { if (blendRows.length <= 1) return; blendRows.splice(k, 1); blendRender(); }
function blendCalc() {
    const per = {};
    blendRows.forEach(r => { const g = num(r.g); if (g > 0) per[r.i] = (per[r.i] || 0) + g; });
    let tg = 0, tc = 0; const errors = [], parts = [];
    Object.keys(per).forEach(k => {
        const it = state.items[parseInt(k)], g = per[k], c = costNow(it, g);
        if (g > it.stock + 1e-6) errors.push(`${it.name}: স্টক ${fg(it.stock)} এর চেয়ে বেশি`);
        tg += g; tc += c; parts.push({ it, g, c });
    });
    const le = el('bl-loss'), loss = le ? num(le.value) : 0, net = tg - loss;
    if (tg > 0 && loss >= tg) errors.push('ওজন কমা মোট ওজনের চেয়ে কম হতে হবে');
    return { tg, loss, net, tc, avg: net > 0 ? tc / net * 1000 : 0, errors, parts };
}
function blendPreview() {
    const c = blendCalc();
    setHtml('bl-prev', `${row2('মোট উপাদান ওজন', fg(c.tg))}${c.loss > 0 ? row2('ওজন কমা/নষ্ট', '- ' + fg(c.loss)) : ''}${row2('ব্লেন্ডের ওজন', fg(c.net))}${row2('মোট খরচ', tk(c.tc))}<div class="flex justify-between font-extrabold text-purple-900"><span>গড় কেজি দর</span><span>৳ ${fmt(c.avg)}/কেজি</span></div>${c.errors.length ? '<div class="text-red-600">' + esc(c.errors.join(' | ')) + '</div>' : ''}`);
}
function blendSave() {
    const name = el('bl-name').value.trim(), c = blendCalc();
    if (!name) { alert('ব্লেন্ডের নাম লিখুন'); return; }
    if (c.tg <= 0) { alert('উপাদান ও গ্রাম লিখুন'); return; }
    if (c.errors.length) { alert(c.errors.join('\n')); return; }
    if (c.parts.some(p => p.it.name === name)) { alert('ব্লেন্ডের নাম উপাদানের নামের সমান হতে পারে না'); return; }
    const ex = state.map[name];
    if (ex && !ex.isMixed) { alert('এই নামে সাধারণ আইটেম আছে, অন্য নাম দিন'); return; }
    const now = Date.now(), ref = uid('bl_');
    let k = 1;
    c.parts.forEach(p => db.txs.push(makeTx('BLEND_OUT', p.it.name, p.g, 0, p.c, ref, 'ব্লেন্ড: ' + name, now + (k++))));
    db.txs.push(makeTx('BLEND_IN', name, c.net, c.avg, c.tc, ref, c.loss > 0 ? 'ওজন কমেছে ' + fg(c.loss) : '', now + (k++)));
    closeModal(); ui.tab = 'stock'; refresh(); toast('ব্লেন্ড তৈরি হয়েছে');
}

// ---------- এক্সপোর্ট ----------
function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const csvCell = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
function exportTxCsv() {
    const lines = [['তারিখ', 'ধরন', 'আইটেম', 'গ্রাম', 'কেজি দর', 'পরিমাণ/আয় ৳', 'খরচ ৳', 'রেফারেন্স', 'নোট'].map(csvCell).join(',')];
    db.txs.slice().sort((a, b) => a.ts - b.ts).forEach(t => lines.push([t.date, TYPE_LABEL[t.type] || t.type, t.item, t.grams, t.pricePerKg, t.amountTk, round(state.costOf[t.id] || 0, 2), t.ref, t.note].map(csvCell).join(',')));
    download('safabox-transactions.csv', lines.join('\n'));
}
function exportItemsCsv() {
    const lines = [['আইটেম', 'মোট কেনা g', 'মোট কেনা ৳', 'লাইফটাইম গড় দর', 'প্যাকেটে g', 'প্যাকেটে ৳', 'বাল্ক g', 'খাওয়া g', 'খাওয়া ৳', 'বর্তমান স্টক g', 'বর্তমান গড় দর', 'স্টক মূল্য ৳'].map(csvCell).join(',')];
    state.items.forEach(i => lines.push([i.name, round(i.boughtG, 1), round(i.boughtCost, 2), round(i.lifeAvgBuy, 2), round(i.pktG, 1), round(i.pktCost, 2), round(i.bulkG, 1), round(i.eatG, 1), round(i.eatCost, 2), round(i.stock, 1), round(i.avg, 2), round(i.value, 2)].map(csvCell).join(',')));
    download('safabox-items.csv', lines.join('\n'));
}

// ---------- সিঙ্ক ----------
let syncing = false, syncAgain = false, syncTimer = null, lastSyncOk = null;
function pendingCount() { return db.txs.filter(t => !t.synced).length + db.batches.filter(b => !b.synced).length + db.pendingDeleteTx.length + db.pendingDeleteBatch.length + (db.runningDirty ? 1 : 0); }
function sig() { return db.txs.map(t => t.id).join(',') + '#' + db.batches.map(b => b.id).join(',') + '#' + (db.running ? db.running.id : ''); }
function updateBadge() {
    const ic = el('sync-icon'), tx = el('sync-text'); if (!ic) return;
    const p = pendingCount();
    if (syncing) { ic.className = 'fa-solid fa-rotate fa-spin'; tx.textContent = 'সিঙ্ক হচ্ছে...'; }
    else if (!navigator.onLine || lastSyncOk === false) { ic.className = 'fa-solid fa-cloud-bolt'; tx.textContent = p ? `অফলাইন (${p})` : 'অফলাইন'; }
    else if (p > 0) { ic.className = 'fa-solid fa-cloud-arrow-up'; tx.textContent = `${p}টি বাকি`; }
    else { ic.className = 'fa-solid fa-cloud'; tx.textContent = 'সিঙ্ক ঠিক'; }
}
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 800); }
const sleep = ms => new Promise(r => setTimeout(r, ms));
function normTx(r) { return { id: String(r.id), ts: num(r.ts), date: String(r.date || ''), type: String(r.type || ''), item: String(r.item || ''), grams: num(r.grams), pricePerKg: num(r.pricePerKg), amountTk: num(r.amountTk), ref: String(r.ref || ''), note: String(r.note || '') }; }
function normBatch(r) { return { id: String(r.id), ts: num(r.ts), date: String(r.date || ''), packets: num(r.packets), packagingCost: num(r.packagingCost), sellingPrice: num(r.sellingPrice), soldPackets: (r.soldPackets === '' || r.soldPackets == null) ? undefined : num(r.soldPackets), note: String(r.note || '') }; }
function mergeServer(data) {
    if (data && data.ok === false && data.message === 'unauthorized') { toast('সিকিউরিটি কী ভুল বা দেওয়া হয়নি (হোমের টুলস দেখুন)'); throw new Error('unauthorized'); }
    if (!data || data.ok !== true || !Array.isArray(data.transactions)) throw new Error('bad response');
    const sTx = data.transactions.filter(r => r && r.id).map(normTx);
    const sB = (data.batches || []).filter(r => r && r.id).map(normBatch);
    const sIds = new Set(sTx.map(t => t.id)), sbIds = new Set(sB.map(b => b.id));
    const pd = new Set(db.pendingDeleteTx), pdb = new Set(db.pendingDeleteBatch);
    db.pendingDeleteTx = db.pendingDeleteTx.filter(id => sIds.has(id));
    db.pendingDeleteBatch = db.pendingDeleteBatch.filter(id => sbIds.has(id));
    const txs = [], bs = [];
    sTx.forEach(t => { if (!pd.has(t.id)) txs.push(Object.assign(t, { synced: true })); });
    db.txs.forEach(t => { if (!t.synced && !sIds.has(t.id)) txs.push(t); });
    sB.forEach(b => { if (pdb.has(b.id)) return; const old = db.batches.find(x => x.id === b.id); if (old && !old.synced) { bs.push(old); return; } bs.push(Object.assign(b, { synced: true }, old && old.snap ? { snap: old.snap } : {})); });
    db.batches.forEach(b => { if (!b.synced && !sbIds.has(b.id)) bs.push(b); });
    db.txs = txs; db.batches = bs;
    if ('running' in data) {
        const sr = data.running || null;
        if (db.runningDirty) { if ((sr && sr.id) === (db.running && db.running.id)) db.runningDirty = false; }
        else db.running = sr;
    }
}
function pull() {
    return new Promise(resolve => {
        const cb = 'sbx_cb_' + Date.now();
        const s = document.createElement('script');
        const done = ok => { clearTimeout(timer); delete window[cb]; s.remove(); resolve(ok); };
        const timer = setTimeout(() => done(false), 20000);
        window[cb] = data => { try { mergeServer(data); done(true); } catch (e) { console.error(e); if (Array.isArray(data)) toast('Apps Script কোড নতুন ভার্সনে আপডেট করুন'); done(false); } };
        s.onerror = () => done(false);
        s.src = `${endpoint()}?callback=${cb}&key=${encodeURIComponent(getKey())}&t=${Date.now()}`;
        document.body.appendChild(s);
    });
}
async function pushPending() {
    const strip = o => { const c = Object.assign({}, o); delete c.synced; return c; };
    const body = { action: 'sync', key: getKey(), addTx: db.txs.filter(t => !t.synced).map(strip), addBatches: db.batches.filter(b => !b.synced).map(strip), deleteTx: db.pendingDeleteTx.slice(), deleteBatches: db.pendingDeleteBatch.slice() };
    if (db.runningDirty) body.running = db.running;
    await fetch(endpoint(), { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
    await sleep(2000);
}
async function syncNow(manual) {
    if (syncing) { syncAgain = true; return; }
    syncing = true; updateBadge();
    const before = sig();
    let ok = false;
    try { if (pendingCount() > 0) await pushPending(); ok = await pull(); } catch (e) { ok = false; }
    syncing = false; lastSyncOk = ok;
    persist(); recompute();
    if (sig() !== before) render(); else updateBadge();
    if (manual) toast(ok ? (pendingCount() ? 'কিছু এন্ট্রি এখনো সার্ভারে পৌঁছায়নি, আবার চেষ্টা করুন' : 'সিঙ্ক সম্পন্ন') : 'সার্ভারে যোগাযোগ করা যায়নি');
    if (syncAgain) { syncAgain = false; scheduleSync(); }
}
function setKey() {
    const v = prompt('সিকিউরিটি কী (Apps Script এর SBX_KEY এর সাথে মিলতে হবে; ফাঁকা = কোনো কী নয়):', getKey());
    if (v !== null) { localStorage.setItem('sbx_key', v.trim()); toast('কী সেভ হয়েছে'); syncNow(true); }
}
function setEndpoint() {
    const v = prompt('Apps Script Web App URL (/exec দিয়ে শেষ):', endpoint());
    if (v && v.trim()) { localStorage.setItem('sbx_endpoint', v.trim()); toast('URL সেভ হয়েছে'); syncNow(true); }
}
function clearLocal() {
    if (db.running && !confirm('একটি ব্যাচ চলছে। ক্যাশ মুছলে চলমান ব্যাচের তথ্য হারাবে। তবু মুছবেন?')) return;
    if (pendingCount() > 0 && !confirm('সার্ভারে যায়নি এমন ' + pendingCount() + 'টি এন্ট্রি আছে, মুছলে সেগুলো হারাবে। তবু মুছবেন?')) return;
    if (!pendingCount() && !confirm('লোকাল ক্যাশ মুছে সার্ভার থেকে নতুন করে লোড করবেন?')) return;
    localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_DRAFT); location.reload();
}

window.addEventListener('online', () => scheduleSync());
window.addEventListener('DOMContentLoaded', () => { render(); syncNow(false); });
</script>
