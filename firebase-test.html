<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase টেস্ট</title>
<style>
  body { font-family: system-ui, "Noto Sans Bengali", sans-serif; background:#f3f4f6; margin:0; padding:12px; color:#111827; }
  .box { max-width: 560px; margin: 0 auto 12px; background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px; }
  h1 { font-size:18px; margin:0 0 4px; } h2 { font-size:14px; margin:0 0 8px; }
  button { background:#059669; color:#fff; border:0; border-radius:8px; padding:10px 14px; font-weight:700; font-size:14px; }
  button.gray { background:#6b7280; } button.red { background:#dc2626; padding:6px 10px; font-size:12px; }
  input { width:100%; box-sizing:border-box; padding:9px; border:1px solid #d1d5db; border-radius:8px; font-size:14px; margin-bottom:6px; }
  .row { display:flex; gap:6px; } .row input { flex:1; min-width:0; }
  .item { display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f3f4f6; padding:8px 0; font-size:13px; }
  .tag { font-size:10px; background:#fef3c7; color:#92400e; border-radius:99px; padding:1px 7px; margin-left:6px; }
  .tag.ok { background:#d1fae5; color:#065f46; }
  #err { color:#b91c1c; font-size:13px; white-space:pre-wrap; }
  .muted { color:#6b7280; font-size:12px; }
</style>
</head>
<body>

<div class="box">
  <h1>Firebase টেস্ট পেজ</h1>
  <div class="muted">Google লগইন + ডাটাবেসে সেভ ও লোড পরীক্ষা</div>
  <div id="err"></div>
</div>

<div class="box" id="loginBox">
  <h2>১) লগইন</h2>
  <div id="loggedOut"><button onclick="doLogin()">Google দিয়ে লগইন</button></div>
  <div id="loggedIn" style="display:none">
    <div>নাম: <b id="uName"></b></div>
    <div class="muted" id="uEmail"></div>
    <div class="muted">ইউজার আইডি: <span id="uUid"></span></div>
    <div style="margin-top:8px"><button class="gray" onclick="doLogout()">লগআউট</button></div>
  </div>
</div>

<div class="box" id="dataBox" style="display:none">
  <h2>২) নতুন লেনদেন সেভ করুন</h2>
  <input id="item" placeholder="আইটেম (যেমন: কিসমিস)">
  <div class="row">
    <input id="grams" type="number" inputmode="decimal" placeholder="গ্রাম">
    <input id="price" type="number" inputmode="decimal" placeholder="কেজি দর ৳">
  </div>
  <button onclick="addTx()">সেভ করুন</button>
  <div class="muted" style="margin-top:6px">ইন্টারনেট বন্ধ রেখে সেভ করেও দেখুন: লিস্টে "সেভ হচ্ছে" দেখাবে, নেট এলে নিজে সার্ভারে চলে যাবে।</div>
</div>

<div class="box" id="listBox" style="display:none">
  <h2>৩) আপনার সেভ করা লেনদেন</h2>
  <div id="list" class="muted">লোড হচ্ছে...</div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyC2bmAtHLQNt1nobq8y-yyDaYAsNWIEKgc",
  authDomain: "demomixfood.firebaseapp.com",
  projectId: "demomixfood",
  storageBucket: "demomixfood.firebasestorage.app",
  messagingSenderId: "905891531269",
  appId: "1:905891531269:web:fe640a761c23f7377aea6c"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $ = id => document.getElementById(id);
const showErr = m => { $('err').textContent = m || ''; };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });

let unsub = null, uid = null;

window.doLogin = async () => {
  showErr('');
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) {
    if (e.code === 'auth/unauthorized-domain') showErr("এই ওয়েবসাইটের ঠিকানা Firebase-এ অনুমোদিত নয়।\nAuthentication > Settings > Authorized domains এ ঠিকানা যোগ করুন।");
    else if (e.code === 'auth/operation-not-allowed') showErr("Google সাইন-ইন চালু করা হয়নি।");
    else if (e.code !== 'auth/popup-closed-by-user') showErr(e.code + ': ' + e.message);
  }
};

window.doLogout = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    uid = null;
    $('loggedOut').style.display = '';$('loggedIn').style.display = 'none';
    $('dataBox').style.display = 'none';$('listBox').style.display = 'none';
    return;
  }
    uid = user.uid;
  $('uName').textContent = user.displayName || '';
  $('uEmail').textContent = user.email || '';
  $('uUid').textContent = user.uid;
  
  $('loggedOut').style.display = 'none';
  $('loggedIn').style.display = '';
  $('dataBox').style.display = '';
  $('listBox').style.display = '';

  const q = query(collection(db, 'users', uid, 'transactions'), orderBy('ts', 'desc'));
  unsub = onSnapshot(q, snap => {
    if (snap.empty) { $('list').textContent = 'এখনো কিছু নেই'; return; }
    $('list').innerHTML = '';
    snap.forEach(d => {
      const t = d.data(), pending = d.metadata.hasPendingWrites;
      const row = document.createElement('div'); row.className = 'item';
      const left = document.createElement('div');
      left.textContent = `${t.item} • ${t.grams}g • ৳${t.price}/কেজি`;
      const tag = document.createElement('span');
      tag.className = 'tag' + (pending ? '' : ' ok'); tag.textContent = pending ? 'সেভ হচ্ছে' : 'সার্ভারে আছে';
      left.appendChild(tag);
      const del = document.createElement('button'); del.className = 'red'; del.textContent = 'মুছুন';
      del.onclick = () => deleteDoc(doc(db, 'users', uid, 'transactions', d.id));
      row.append(left, del); $('list').appendChild(row);
    });
  }, e => showErr('ডাটা পড়া যায়নি: ' + e.code));
});

window.addTx = async () => {
  showErr('');
  const item = $('item').value.trim(), grams = parseFloat($('grams').value), price = parseFloat($('price').value);
  if (!item || !(grams > 0) || !(price >= 0)) { showErr('আইটেম, গ্রাম ও দর ঠিকমতো লিখুন'); return; }
  const id = 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  try {
    setDoc(doc(db, 'users', uid, 'transactions', id), { item, grams, price, ts: Date.now() })
      .catch(e => showErr('সেভ হয়নি: ' + e.code));
    $('item').value = ''; $('grams').value = '';$('price').value = '';
  } catch (e) { showErr(e.code + ': ' + e.message); }
};
</script>
</body>
</html>
